schema_version: "1.0"

source:
  engine:
    type: string
    enum: [postgresql, mysql, mongodb, mssql]
  connection:
    host: { type: string }
    port: { type: integer }
    database: { type: string }
    username: { type: string }
    password_secret: { type: string }
    ssl: { type: boolean, default: true }
    ssl_ca_cert: { type: string, optional: true }

target:
  engine:
    type: string
    enum: [postgresql, mysql, mongodb, mssql, cosmos_mongo]
  connection:
    host: { type: string }
    port: { type: integer }
    database: { type: string }
    username: { type: string }
    password_secret: { type: string }
    routine_definer:
      type: string
      optional: true
      description: |
        Optional MySQL DEFINER override in user@host format applied to migrated
        routines, triggers, and events on the target. When unset, the target
        account's own identity is used.
    preserve_source_definer:
      type: boolean
      default: false
      description: |
        MySQL only. Keep the source DEFINER account on migrated objects
        instead of rewriting it to the target's definer. Only applies when the
        referenced source account exists on the target.
    security_users:
      type: array
      optional: true
      description: |
        Optional MySQL user account allowlist; global direct permissions are
        discovered only for explicitly selected users.
      items:
        type: object
        properties:
          user: { type: string }
          host: { type: string, default: "%" }
    ssl: { type: boolean, default: true }
    ssl_ca_cert: { type: string, optional: true }

migration:
  mode:
    type: string
    enum: [full, cdc-incremental, cdc-continuous]
    default: full
  batch_size:
    type: integer
    default: 1000
    minimum: 1
  stop_on_error:
    type: boolean
    default: false
  field_mappings:
    type: array
    items:
      type: object
      properties:
        source_field: { type: string }
        target_field: { type: string }
        exclude: { type: boolean, default: false }
  max_document_size_mb:
    type: number
    default: 2.0
  include_schemas:
    type: array
    items: { type: string }
    default: [public]
    description: |
      STEP 3B — list of source schemas for PostgreSQL metadata discovery.
      Default is ["public"] for backward compatibility. PostgreSQL
      internal schemas (pg_catalog, information_schema, pg_toast, pg_*)
      are filtered out defensively regardless of what is configured.

cdc:
  poll_interval:
    type: integer
    default: 10
    minimum: 1
  allow_source_service_restart:
    type: boolean
    default: false

retry:
  max_retries:
    type: integer
    default: 3
  base_delay_seconds:
    type: number
    default: 1.0
  max_delay_seconds:
    type: number
    default: 30.0
  circuit_breaker_max_failures:
    type: integer
    default: 5
  circuit_breaker_reset_timeout_seconds:
    type: number
    default: 60.0

secrets:
  provider:
    type: string
    enum: [env, aws_secrets_manager, gcp_secret_manager, hashicorp_vault, local_encrypted_file, azure_keyvault]
    default: env
  aws_secrets_manager:
    region: { type: string, optional: true }
  gcp_secret_manager:
    project_id: { type: string, optional: true }
  hashicorp_vault:
    url: { type: string }
    token: { type: string }
    mount_point: { type: string, default: secret }
  local_encrypted_file:
    file: { type: string, default: secrets.enc }
    key_source: { type: string, enum: [env, keyring], default: env }
    key_env_var: { type: string, default: MIGRATION_SECRETS_KEY }
    keyring_service: { type: string, default: migration-platform/secrets-key }
    auto_create: { type: boolean, default: false }
  azure_keyvault:
    url: { type: string, optional: true }
    credential_secret_name: { type: string, optional: true }

alerting:
  notifier:
    type: string
    enum: [webhook, slack, teams, email, none]
    default: none
  webhook_url: { type: string, optional: true }

validation:
  mode:
    type: string
    enum: [count, checksum, full]
    default: count
  sample_size:
    type: integer
    default: 1000

logging:
  level:
    type: string
    enum: [DEBUG, INFO, WARNING, ERROR]
    default: INFO
  file: { type: string, optional: true }
