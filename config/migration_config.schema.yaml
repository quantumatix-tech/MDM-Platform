schema_version: "1.0"

source:
  engine:
    type: string
    enum: [postgresql, mysql, mongodb, mssql]
  connection:
    host: { type: string }
    port: { type: integer }
    database: { type: string }
    username: { type: string }
    password_secret: { type: string }
    ssl: { type: boolean, default: true }
    ssl_ca_cert: { type: string, optional: true }

target:
  engine:
    type: string
    enum: [postgresql, mysql, mongodb, mssql, cosmos_mongo]
  connection:
    host: { type: string }
    port: { type: integer }
    database: { type: string }
    username: { type: string }
    password_secret: { type: string }
    routine_definer:
      type: string
      optional: true
      description: Optional MySQL DEFINER override in user@host format for migrated routines, triggers, and events. Defaults to SELECT CURRENT_USER() on the target.
    ssl: { type: boolean, default: true }
    ssl_ca_cert: { type: string, optional: true }

migration:
  mode:
    type: string
    enum: [full, cdc-incremental, cdc-continuous]
    default: full
  batch_size:
    type: integer
    default: 1000
    minimum: 1
  reconcile_target_schema:
    type: boolean
    default: false
    description: Opt-in MySQL FULL-mode staged reconciliation for incompatible partitioned target tables.
  stop_on_error:
    type: boolean
    default: false
  one_time_event_safety_lead_seconds:
    type: integer
    default: 300
    minimum: 0
    description: Block enabled MySQL one-time Events that are due or scheduled within this window at source snapshot or target creation. This prevents silently changing their execution semantics.
  security_principals:
    type: object
    optional: true
    description: Optional persisted MySQL server-principal allowlist. Prefer runtime --security-user/--security-role selection; omit to skip MySQL users, roles, role edges, and security-scope grants safely.
    properties:
      users:
        type: array
        items:
          type: object
          properties:
            user: { type: string }
            host: { type: string, default: "%" }
      roles:
        type: array
        items:
          type: object
          properties:
            user: { type: string }
            host: { type: string, default: "%" }
  dry_run:
    type: boolean
    default: false
  field_mappings:
    type: array
    items:
      type: object
      properties:
        source_field: { type: string }
        target_field: { type: string }
        exclude: { type: boolean, default: false }
  max_document_size_mb:
    type: number
    default: 2.0
  include_schemas:
    type: array
    items: { type: string }
    default: [public]
    description: |
      STEP 3B — list of source schemas for PostgreSQL metadata discovery.
      Default is ["public"] for backward compatibility. PostgreSQL
      internal schemas (pg_catalog, information_schema, pg_toast, pg_*)
      are filtered out defensively regardless of what is configured.

cdc:
  poll_interval:
    type: integer
    default: 10
    minimum: 1
  allow_source_service_restart:
    type: boolean
    default: false

retry:
  max_retries:
    type: integer
    default: 3
  base_delay_seconds:
    type: number
    default: 1.0
  max_delay_seconds:
    type: number
    default: 30.0
  circuit_breaker_max_failures:
    type: integer
    default: 5
  circuit_breaker_reset_timeout_seconds:
    type: number
    default: 60.0

secrets:
  provider:
    type: string
    enum: [env, aws_secrets_manager, gcp_secret_manager, hashicorp_vault, local_encrypted_file, azure_keyvault]
    default: env
  aws_secrets_manager:
    region: { type: string, optional: true }
  gcp_secret_manager:
    project_id: { type: string, optional: true }
  hashicorp_vault:
    url: { type: string }
    token: { type: string }
    mount_point: { type: string, default: secret }
  local_encrypted_file:
    file: { type: string, default: secrets.enc }
    key_source: { type: string, enum: [env, keyring], default: env }
    key_env_var: { type: string, default: MIGRATION_SECRETS_KEY }
    keyring_service: { type: string, default: migration-platform/secrets-key }
    auto_create: { type: boolean, default: false }
  azure_keyvault:
    url: { type: string, optional: true }
    credential_secret_name: { type: string, optional: true }

alerting:
  notifier:
    type: string
    enum: [webhook, slack, teams, email, none]
    default: none
  webhook_url: { type: string, optional: true }

validation:
  mode:
    type: string
    enum: [count, checksum, full]
    default: count
  sample_size:
    type: integer
    default: 1000

logging:
  level:
    type: string
    enum: [DEBUG, INFO, WARNING, ERROR]
    default: INFO
  file: { type: string, optional: true }
