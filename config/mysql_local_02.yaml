
source:
  engine: mysql
  connection:
    host: mysql-host.local
    port: 33062
    database: MigrationE2E_MySQL_Source
    username: migration_e2e
    password_secret: mysql_e2e_source_pass
    ssl: true
    tls:
      enabled: true
      ca_path: /app/certs/mysql_ca.pem
      verify_cert: true
      verify_identity: true

target:
  engine: mysql
  connection:
    host: mysql-host.local
    port: 33062
    database: migratione2e_mysql_target
    username: migration_e2e
    password_secret: mysql_e2e_target_pass
    ssl: true
    tls:
      enabled: true
      ca_path: /app/certs/mysql_ca.pem
      verify_cert: true
      verify_identity: true
    source_engine: mysql
    

migration:
  mode: full
  batch_size: 1000
  include_schemas: []
  security_users:
    - user: migration_e2e
      host: "192.168.1.28"
secrets:
  provider: env

alerting:
  notifier: none

validation:
  mode: count
  sample_size: 1000

logging:
  level: INFO
  file: logs/mysql_e2e_acceptance.log


