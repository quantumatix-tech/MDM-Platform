# E2E Acceptance Demo Configuration — MySQL
#
# Used by the REAL MIGRATION acceptance workflow (Mode 2):
#
#   1. Setup:   python tests/e2e/mysql/run_setup.py --config config/mysql_e2e_acceptance.yaml
#   2. Migrate: python -m migration_platform --config config/mysql_e2e_acceptance.yaml --mode full
#   3. Validate: python tests/e2e/mysql/run_validation.py --config config/mysql_e2e_acceptance.yaml
#
# Passwords are resolved at runtime from environment variables via the
# platform's SECRET_<name> convention (see core/secrets/env.py).
#
# Required environment variables:
#   SECRET_mysql_e2e_source_pass  — MySQL root password for source DB
#   SECRET_mysql_e2e_target_pass  — MySQL root password for target DB
#
# Both may point to the same local instance; the secret keys are kept
# separate so cloud or cross-instance runs can supply distinct values.

source:
  engine: mysql
  connection:
    host: 127.0.0.1
    port: 3306
    database: MigrationE2E_MySQL_Source
    username: root
    password_secret: mysql_e2e_source_pass
    ssl: false

target:
  engine: mysql
  connection:
    host: 127.0.0.1
    port: 3306
    database: MigrationE2E_MySQL_Target
    username: root
    password_secret: mysql_e2e_target_pass
    ssl: false
    source_engine: mysql

migration:
  mode: full
  batch_size: 1000
  include_schemas: []

secrets:
  provider: env

alerting:
  notifier: none

validation:
  mode: count
  sample_size: 1000

logging:
  level: INFO
  file: logs/mysql_e2e_acceptance.log

# E2E-specific settings consumed by the acceptance setup/validation runners.
e2e:
  engine: mysql
  schema: ""
  fixture_path: tests/e2e/mysql/fixtures
  source_database: MigrationE2E_MySQL_Source
  target_database: MigrationE2E_MySQL_Target

  # Safety: only databases whose name matches this regex may be dropped/created.
  safe_db_pattern: "^MigrationE2E_MySQL_.+$"

  cleanup:
    mode: on_success   # always | on_success | never

  functional:
    enabled: true
