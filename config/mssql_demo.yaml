source:
  engine: mssql
  connection:
    host: localhost
    port: 1533
    database: mssql_source_db1
    username: sa
    password_secret: mssql_source_pass
    ssl: false

target:
  engine: mssql
  connection:
    host: localhost
    port: 1533
    database: mssql_target_db2
    username: sa
    password_secret: mssql_target_pass
    ssl: false

migration:
  mode: full
  batch_size: 1000
  include_schemas:
    - sales

secrets:
  provider: env

alerting:
  notifier: none

validation:
  mode: count
  sample_size: 1000

logging:
  level: INFO
