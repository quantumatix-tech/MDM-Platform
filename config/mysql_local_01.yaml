source:
  engine: mysql
  connection:
    host: 127.0.0.1
    port: 33062
    database: MigrationE2E_MySQL_Source
    username: root
    password_secret: mysql_e2e_source_pass
    ssl: false

target:
  engine: mysql
  connection:
    host: 127.0.0.1
    port: 33062
    database: migratione2e_mysql_target
    username: root
    password_secret: mysql_e2e_target_pass
    ssl: false
    source_engine: mysql
    

migration:
  mode: full
  batch_size: 1000
  include_schemas: []

secrets:
  provider: env

alerting:
  notifier: none

validation:
  mode: count
  sample_size: 1000

logging:
  level: INFO
  file: logs/mysql_e2e_acceptance.log