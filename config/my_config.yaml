# ============================================================
#  Migration Platform - Real Config File
#  Mode: PostgreSQL to PostgreSQL (cdc-incremental)
# ============================================================

# SOURCE DATABASE (where data comes FROM)
source:
  engine: postgresql
  connection:
    host: localhost
    port: 5432
    database: eds_db1
    username: postgres
    password_secret: source_db_pass
    ssl: false

# TARGET DATABASE (where data goes TO)
target:
  engine: postgresql
  connection:
    host: dmt-postgre-test.postgres.database.azure.com
    port: 5432
    database: postgres
    username: dmt_user
    password_secret: target_db_pass
    ssl: true

# MIGRATION SETTINGS
migration:
  mode: cdc-incremental
  batch_size: 1000
  # field_mappings:
  #   - source_field: old_column_name
  #     target_field: new_column_name
  #   - source_field: sensitive_column
  #     exclude: true

# CDC SETTINGS
cdc:
  poll_interval: 10

# RETRY / RESILIENCE
retry:
  max_retries: 3
  base_delay_seconds: 1.0
  max_delay_seconds: 30.0
  circuit_breaker_max_failures: 5
  circuit_breaker_reset_timeout_seconds: 60.0

# SECRETS PROVIDER
secrets:
  provider: env

# ALERTING (optional)
alerting:
  notifier: none

# VALIDATION
validation:
  mode: count
  sample_size: 1000

# LOGGING
logging:
  level: INFO
  # file: migration.log