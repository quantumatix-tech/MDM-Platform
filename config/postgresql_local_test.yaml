source:
  engine: postgresql
  connection:
    host: 127.0.0.1
    port: 5432
    database: postgres_existing_source
    username: postgres
    password_secret: postgres-source-password
    ssl: false

target:
  engine: postgresql
  connection:
    host: 127.0.0.1
    port: 5432
    database: postgres_existing_target
    username: postgres
    password_secret: postgres-target-password
    ssl: false

migration:
  mode: full
  batch_size: 1000
  include_schemas:
    - public

retry:
  max_retries: 3
  base_delay_seconds: 1.0
  max_delay_seconds: 30.0

secrets:
  provider: local_encrypted_file
  local_encrypted_file:
    key_source: keyring
    keyring_service: migration-platform/secrets-key
    auto_create: false

alerting:
  notifier: none

validation:
  mode: count
  sample_size: 1000

logging:
  level: INFO