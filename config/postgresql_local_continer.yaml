source:
  engine: postgresql
  connection:
    host: 172.24.48.1
    port: 55432
    database: MigrationE2E_PostgreSQL_Source
    username: postgres
    password_secret: postgresql_e2e_source_pass
    ssl: false

target:
  engine: postgresql
  connection:
    host: 172.24.48.1
    port: 55432
    database: MigrationE2E_PostgreSQL_Target
    username: postgres
    password_secret: postgresql_e2e_target_pass
    ssl: false

migration:
  mode: full
  batch_size: 1000
  include_schemas:
    - training

retry:
  max_retries: 3
  base_delay_seconds: 1.0
  max_delay_seconds: 30.0

secrets:
  provider: env

alerting:
  notifier: none

validation:
  mode: count
  sample_size: 1000

logging:
  level: INFO