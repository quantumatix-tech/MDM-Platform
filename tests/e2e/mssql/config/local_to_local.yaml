# MSSQL E2E Migration Validation — Local to Local Configuration
#
# This config drives BOTH the E2E framework and the REAL Migration Platform.
# Passwords are resolved at runtime from environment variables via the
# platform's SECRET_<name> convention (see core/secrets/env.py).
#
# Required environment variables for local_to_local:
#   SECRET_mssql_e2e_source_pass  — sa password for the source SQL Server
#   SECRET_mssql_e2e_target_pass  — sa password for the target SQL Server
#
# Both may point to the same local instance; the secret keys are kept
# separate so cloud or cross-instance runs can supply distinct values.

source:
  engine: mssql
  connection:
    host: localhost
    port: 1533
    database: MigrationE2E_MSSQL_Source
    username: sa
    password_secret: mssql_e2e_source_pass
    ssl: false

target:
  engine: mssql
  connection:
    host: localhost
    port: 1533
    database: MigrationE2E_MSSQL_Target
    username: sa
    password_secret: mssql_e2e_target_pass
    ssl: false
    source_engine: mssql

migration:
  mode: full
  batch_size: 1000
  include_schemas:
    - training

secrets:
  provider: env

alerting:
  notifier: none

validation:
  mode: count
  sample_size: 1000

logging:
  level: INFO

# E2E-specific settings consumed by the E2E test runner.
e2e:
  schema: training
  fixture_path: fixtures
  source_database: MigrationE2E_MSSQL_Source
  target_database: MigrationE2E_MSSQL_Target

  # Safety: only databases whose name matches this regex may be dropped/created.
  safe_db_pattern: "^MigrationE2E_MSSQL_.+$"

  cleanup:
    mode: on_success   # always | on_success | never

  security:
    enabled: true

  functional:
    enabled: true

  expected:
    schemas:
      - training
    tables:
      - training.Customers
      - training.Products
      - training.Orders
      - training.OrderDetails
      - training.OrderAudit
      - training.PK_Name_Test
      - training.PartitionedOrders
    row_counts:
      training.Customers: 5
      training.Products: 5
      training.Orders: 5
      training.OrderDetails: 8
      training.OrderAudit: 5
      training.PK_Name_Test: 2
      training.PartitionedOrders: 3
