[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "migration-platform"
version = "0.2.2"
description = "Unified cross-database migration platform"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.0",
    "mysql-connector-python>=8.0",
    "mysql-replication>=0.44",
    "pymongo>=4.0",
    "pyodbc>=4.0",
    "azure-identity>=1.12",
    "azure-keyvault-secrets>=4.0",
    "azure-cosmos>=4.0.0",
    "pyyaml>=6.0",
    "requests>=2.0",
    "boto3>=1.28",
    "google-cloud-secret-manager>=2.16",
    "hvac>=1.2",
    "cryptography>=41.0",
    "keyring>=24.0",
    "rich>=13.0",
    "azure-storage-blob>=12.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8.0", "pytest-mock>=3.14"]
aws = ["boto3>=1.28"]
gcp = ["google-cloud-secret-manager>=2.16"]
vault = ["hvac>=1.2"]

[tool.setuptools.packages.find]
include = ["core*", "migration_platform*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: integration tests requiring real database containers",
]